# YOLOv8n with FPD (frequency-preserving downsampling) and DHTA (dynamic hypergraph token attention)
# Reference implementation of the proposed underwater object detector.

nc: 80 # number of classes (overridden by the dataset yaml)
scales: # model compound scaling constants, i.e. 'model=yolov8n_fin.yaml' will call yolov8_fin.yaml with scale 'n'
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# ---------------- backbone ----------------
backbone:
  # [from, repeats, module, args]
  # FPD: the strided stem is replaced by a parameter-free Haar wavelet decomposition (CSConv)
  - [-1, 1, CSConv, [64, 3, 2]]  # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, C2f, [128, True]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, C2f, [256, True]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, C2f, [512, True]]    # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]   # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9

# ---------------- head ----------------
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11 cat backbone P4
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14 cat backbone P3
  - [-1, 3, C2f, [256]]                         # 15 (P3/8-small)

  # DHTA-1 on the high-resolution P3 feature (32 hyperedges)
  - [-1, 1, DHTA, [32]]                         # 16

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 12], 1, Concat, [1]]                  # 18 cat head P4
  - [-1, 3, C2f, [512]]                         # 19 (P4/16-medium)

  # DHTA-2 on the mid-resolution P4 feature
  - [-1, 1, DHTA, [32]]                         # 20

  - [-1, 1, Conv, [512, 3, 2]]                  # 21
  - [[-1, 9], 1, Concat, [1]]                   # 22 cat head P5
  - [-1, 3, C2f, [1024]]                        # 23 (P5/32-large)

  # DHTA-3 on the low-resolution P5 feature
  - [-1, 1, DHTA, [32]]                         # 24

  # Detect consumes the three DHTA-enhanced feature maps
  - [[16, 20, 24], 1, Detect, [nc]]             # 25 Detect(P3, P4, P5)
